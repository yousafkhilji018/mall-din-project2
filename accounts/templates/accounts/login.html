{% extends "base.html" %}
{% block title %}Login | MALL DIN{% endblock %}
{% block content %}
<div class="container" style="padding:40px 16px;max-width:420px;">
  <h1>Login</h1>
  <form method="post" style="margin-top:20px;">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
  </form>
  <p style="margin-top:16px;">No account? <a href="{% url 'register' %}">Register</a></p>
</div>
{% endblock %}
