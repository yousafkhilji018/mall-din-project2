{% extends "base.html" %}
{% block title %}Checkout | MALL DIN{% endblock %}
{% block content %}
<div class="container" style="padding:40px 16px;max-width:640px;">
  <h1>Checkout</h1>
  <p>Total: <strong style="color:#b30000;">Rs. {{ grand_total }}</strong></p>
  <form method="post" style="margin-top:20px;">{% csrf_token %}{{ form.as_p }}
    <button type="submit" class="btn btn-primary">Place Order</button>
  </form>
</div>
{% endblock %}
