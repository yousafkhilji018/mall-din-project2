{% extends "base.html" %}
{% block title %}Register | MALL DIN{% endblock %}
{% block content %}
<div class="container" style="padding:40px 16px;max-width:420px;">
  <h1>Register</h1>
  <form method="post" style="margin-top:20px;">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary" style="width:100%;">Create Account</button>
  </form>
  <p style="margin-top:16px;">Already have an account? <a href="{% url 'login' %}">Login</a></p>
</div>
{% endblock %}
