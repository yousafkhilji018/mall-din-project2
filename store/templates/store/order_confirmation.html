{% extends "base.html" %}
{% block title %}Order Confirmed | MALL DIN{% endblock %}
{% block content %}
<div class="container" style="padding:40px 16px;text-align:center;">
  <h1>Order #{{ order.id }} Confirmed</h1>
  <p>Thank you, {{ order.full_name }}!</p>
  <p>Total: Rs. {{ order.total_amount }}</p>
  <p>Status: {{ order.status }}</p>
  <a href="{% url 'order_history' %}" class="btn btn-primary">My Orders</a>
</div>
{% endblock %}
